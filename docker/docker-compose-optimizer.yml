services:
  # Base Point-LIO service (runs mapping and trajectory)
  point_lio_system:
    container_name: point_lio_system
    build:
      context: .
      dockerfile: Dockerfile
    image: point_lio:latest
    volumes:
      - ./tester_rosbag:/data/rosbag:ro
      - ./optimization_results:/data/optimization_results:rw
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    networks:
      - ros_net
    command: >
      bash -c "
        ros2 launch point_lio mapping_utlidar.launch rviz:=false &
        sleep 2 &&
        python3 mocap_odometry/mocap_odometry/trajectory_node.py
      "

  # Optimizer service (runs parameter optimization)
  optimizer:
    container_name: point_lio_optimizer
    build:
      context: ..
      dockerfile: docker/Dockerfile.optimize
      args:
        BASE_IMAGE: point_lio:latest
    volumes:
      - ./tester_rosbag:/data/rosbag:ro
      - ./optimization_results:/data/optimization_results:rw
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TRIALS=50
      - TARGET_ATE=0.5
      - TIMEOUT=7200
    networks:
      - ros_net
    depends_on:
      - point_lio_system

networks:
  ros_net:
    driver: bridge
