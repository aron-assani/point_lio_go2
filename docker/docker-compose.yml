services:
  point_lio:
    container_name: point_lio_go2
    build: 
      context: .
      args:
        NETWORK_INTERFACE: ${NETWORK_INTERFACE}
    network_mode: host
    tty: true       
    stdin_open: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix