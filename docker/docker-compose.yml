services:
  optimizer:
    container_name: point_lio_optimizer
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../tester_rosbag:/data/rosbag:ro
      - ../optimization_results:/data/optimization_results:rw
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TRIALS=50
      - TARGET_ATE=0.5
      - TIMEOUT=7200
    # Run the optimizer directly
    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /root/ros2_ws/install/setup.bash &&
      python3 /root/point_lio_go2/optimize_utlidar.py --rosbag /data/rosbag --trials $${TRIALS:-50} --target-ate $${TARGET_ATE:-0.5} --output-dir /data/optimization_results
      "
