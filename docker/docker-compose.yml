services:
  optimizer:
    container_name: point_lio_optimizer
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../tester_rosbag:/data/rosbag:ro
      - ../optimization_results:/data/optimization_results:rw
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TRIALS=50
      - TARGET_ATE=0.5
      - TIMEOUT=7200
    stdin_open: true
    tty: true
    # Start interactive shell - run optimizer manually with:
    # docker-compose exec optimizer bash
    # Then inside: python3 /root/point_lio_go2/optimize_utlidar.py --help
    command: bash
