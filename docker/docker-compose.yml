services:
  point_lio:
    container_name: point_lio_trial
    build: 
      context: .
    network_mode: host
    ipc: host
    privileged: true
    tty: true       
    stdin_open: true
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    command: /bin/bash