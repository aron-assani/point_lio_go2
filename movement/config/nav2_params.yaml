# config/nav2_params.yaml

pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: false
    target_frame: "aft_mapped"
    transform_tolerance: 0.01
    min_height: 0.15
    max_height: 0.6
    angle_min: -3.1415
    angle_max: 3.1415
    angle_increment: 0.0087
    scan_time: 0.1
    # Large enough so the robot ignores its own chassis in the raw scan
    range_min: 0.60
    range_max: 10.0
    use_inf: true

amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: camera_init
    # Nav2 tracks the mathematical center of the robot
    robot_base_frame: body_center

behavior_server:
  ros__parameters:
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    odom_topic: "/slam/odometry"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: "/slam/odometry"
    max_vel_x: 0.3
    max_vel_y: 0.3
    max_vel_theta: 0.5
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # Allow slight reverse speeds for tight maneuvers
      min_vel_x: -0.2
      min_vel_y: -0.2
      max_vel_x: 0.3
      max_vel_y: 0.3
      max_vel_theta: 0.5
      # FORCE MINIMUM MOVEMENT to avoid the 0 trajectories trap
      min_speed_xy: 0.05
      max_speed_xy: 0.3
      min_speed_theta: 0.1
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 1.5
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.01
      stateful: True
      transform_tolerance: 0.01
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      Oscillation.scale: 1.0

# --- THE GLOBAL COSTMAP ---
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: camera_init
      # Nav2 tracks the mathematical center of the robot
      robot_base_frame: body_center
      # Rectangular footprint matching the Go2 (Length: 60cm, Width: 30cm)
      footprint: "[ [0.05, 0.05], [0.05, -0.05], [-0.05, -0.05], [-0.05, 0.05] ]"
      resolution: 0.05
      rolling_window: true
      width: 20
      height: 20
      # Removed static_layer because we are doing live SLAM
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# --- THE LOCAL COSTMAP ---
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: camera_init
      # Nav2 tracks the mathematical center of the robot
      robot_base_frame: body_center
      # Rectangular footprint matching the Go2 (Length: 60cm, Width: 30cm)
      footprint: "[ [0.05, 0.05], [0.05, -0.05], [-0.05, -0.05], [-0.05, 0.05] ]"
      resolution: 0.05
      rolling_window: true
      width: 5
      height: 5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55