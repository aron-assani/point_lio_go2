pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "body"
    transform_tolerance: 0.01
    min_height: 0.15
    max_height: 0.6
    angle_min: -3.1415
    angle_max: 3.1415
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.4
    range_max: 10.0
    use_inf: true

amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: camera_init
    robot_base_frame: body

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    # Match these to your execution.py limits
    max_vel_x: 0.5
    max_vel_y: 0.3
    max_vel_theta: 0.8

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0

# --- THE GLOBAL COSTMAP (Full Room View) ---
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: camera_init
      robot_base_frame: body
      robot_radius: 0.3 # Rough radius of the Go2
      resolution: 0.05
      rolling_window: true # Keeps the map dynamically updating
      width: 20
      height: 20
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55 # Pushes the path away from walls

# --- THE LOCAL COSTMAP (Immediate Avoidance) ---
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: camera_init
      robot_base_frame: body
      robot_radius: 0.3
      resolution: 0.05
      rolling_window: true
      width: 5
      height: 5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"