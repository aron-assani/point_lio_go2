# config/nav2_params.yaml

pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "aft_mapped"
    transform_tolerance: 0.5
    min_height: 0.15
    max_height: 0.6
    angle_min: -3.1415
    angle_max: 3.1415
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.65
    range_max: 10.0
    use_inf: true

bt_navigator:
  ros__parameters:
    global_frame: camera_init
    robot_base_frame: body_center

behavior_server:
  ros__parameters:
    robot_base_frame: body_center

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: "/robot/pose_estimate"
    robot_base_frame: "body_center"
    transform_tolerance: 0.5
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      
      # Velocity limits (Allow turning both ways)
      min_vel_x: -0.3
      min_vel_y: 0.0
      max_vel_x: 0.3
      max_vel_y: 0.0
      min_vel_theta: -0.5
      max_vel_theta: 0.5
      
      # Minimum speeds set to 0.0 to prevent sample culling
      min_speed_xy: 0.0
      min_speed_theta: 0.0
      max_speed_xy: 0.3
      
      # High acceleration to ensure full evaluation
      acc_lim_x: 3.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.5
      
      # Goal tolerances
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      
      stateful: True
      
      # Critics configuration (Alignment critics removed for stability)
      critics: ["Oscillation", "BaseObstacle", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      Oscillation.scale: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: camera_init
      robot_base_frame: body_center
      footprint: "[ [0.30, 0.15], [0.30, -0.15], [-0.30, -0.15], [-0.30, 0.15] ]"
      resolution: 0.05
      rolling_window: true
      width: 40
      height: 40
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: camera_init
      robot_base_frame: body_center
      footprint: "[ [0.30, 0.15], [0.30, -0.15], [-0.30, -0.15], [-0.30, 0.15] ]"
      resolution: 0.05
      rolling_window: true
      width: 5
      height: 5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45